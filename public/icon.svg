<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)" />

  <!-- Radio signal wave arcs -->
  <path d="M 170 170 A 120 120 0 0 1 342 170" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-dasharray="1 0" opacity="0.9" />
  <path d="M 125 125 A 185 185 0 0 1 387 125" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.6" />

  <!-- Phone Handset Icon (Classic Telephony / Gateway) -->
  <g transform="translate(136, 170) scale(1.0)">
    <!-- Smartphone Frame -->
    <rect x="35" y="10" width="170" height="270" rx="32" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="14" />
    
    <!-- Phone Screen -->
    <rect x="49" y="38" width="142" height="200" rx="18" fill="#1e293b" />
    
    <!-- Phone Speaker Notch -->
    <rect x="95" y="22" width="50" height="6" rx="3" fill="#64748b" />
    
    <!-- Center Call Button Icon inside Screen -->
    <circle cx="120" cy="138" r="48" fill="url(#primaryGrad)" />
    
    <!-- Call handset icon inside circle -->
    <path d="M 106 122 C 104 122 101 123 99 125 L 94 130 C 92 132 91 136 93 139 C 98 152 107 163 118 171 C 122 174 126 174 129 172 L 135 167 C 137 165 138 162 137 159 L 133 147 C 132 144 129 143 126 144 L 121 146 C 117 142 114 139 110 135 L 112 130 C 114 127 113 124 110 123 Z" fill="#ffffff" />
    
    <!-- SIM Indicator Dot -->
    <circle cx="120" cy="256" r="6" fill="#10b981" />
  </g>
</svg>
